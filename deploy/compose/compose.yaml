name: compass
services:
  home:
    profiles: [home]
    build:
      context: ../..
      dockerfile: deploy/containers/home.Dockerfile
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "127.0.0.1:8101:8101"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8101/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: public.ecr.aws/docker/library/redis:8.2.11-alpine@sha256:fe9daae35cd4fd6ec22416aa4fe0cf6b3e36741e06ff45b9986253fe2a81c041
    restart: unless-stopped
    command:
      [
        redis-server,
        /usr/local/etc/redis/redis.conf,
        --requirepass,
        "${COMPASS_REDIS_PASSWORD:-compass_redis_local_only}",
      ]
    environment:
      REDISCLI_AUTH: ${COMPASS_REDIS_PASSWORD:-compass_redis_local_only}
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    mem_limit: 768m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: pgvector/pgvector:pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: compass
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "compass", "-d", "compass"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    profiles: [app]
    image: compass-agent:local
    build: &agent-build
      context: ../..
      dockerfile: deploy/containers/agent.Dockerfile
    environment:
      DATABASE_URL: ${COMPASS_AGENT_RUNTIME_URL:-postgresql+psycopg://compass_agent_runtime:compass_agent_runtime_local_only@postgres:5432/compass_agent}
      COMPASS_SCHEDULER_DATABASE_URL: &scheduler-dsn ${COMPASS_LOCAL_SCHEDULER_DSN:-postgresql+psycopg://compass_agent_scheduler:compass_agent_scheduler_local_only@postgres:5432/compass_agent}
      AGENT_MIGRATION_DATABASE_URL: ${COMPASS_AGENT_MIGRATOR_URL:-postgresql+psycopg://compass_agent_migrator:compass_agent_migration_local_only@postgres:5432/compass_agent}
      AGENT_PROVISION_DATABASE_URL: postgresql://compass:compass_local_only@postgres:5432/compass
      COMPASS_MODEL_ENCRYPTION_KEY: ${COMPASS_MODEL_ENCRYPTION_KEY:-}
      COMPASS_RETAIL_ALLOWED_ENDPOINTS: ${COMPASS_RETAIL_ALLOWED_ENDPOINTS:-127.0.0.1:55432,localhost:55432,postgres:5432}
      COMPASS_RETAIL_RUN_SCOPE: ${COMPASS_RETAIL_RUN_SCOPE:-}
      COMPASS_RETAIL_RUN_READONLY_DSN: ${COMPASS_RETAIL_RUN_READONLY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "/bin/sh",
        "-c",
        "python scripts/database.py provision && python scripts/database.py migrate && python -m compass_agent.seed",
      ]
  agent:
    env_file:
      - path: ../../work/observability/agent.env
        required: false
    stop_grace_period: 45s
    profiles: [app]
    image: compass-agent:local
    build: *agent-build
    scale: ${COMPASS_AGENT_REPLICAS:-2}
    environment:
      COMPASS_REDIS_URL: redis://redis:6379/0
      COMPASS_REDIS_PASSWORD: ${COMPASS_REDIS_PASSWORD:-compass_redis_local_only}
      COMPASS_RUNTIME_STATE_KEY: ${COMPASS_RUNTIME_STATE_KEY:-}
      COMPASS_RUNTIME_EVENT_TOKEN: ${COMPASS_RUNTIME_EVENT_TOKEN:-}
      COMPASS_SCHEDULER_TOKEN: ${COMPASS_SCHEDULER_TOKEN:-compass_scheduler_local_only}
      COMPASS_RUNTIME_CONSUMER_SLOTS: ${COMPASS_RUNTIME_CONSUMER_SLOTS:-1}
      COMPASS_CONTEXT_RUNTIME_ENABLED: ${COMPASS_CONTEXT_RUNTIME_ENABLED:-true}
      COMPASS_CONTEXT_OPTIMIZATION_ENABLED: ${COMPASS_CONTEXT_OPTIMIZATION_ENABLED:-true}
      COMPASS_CONTEXT_SNAPSHOT_TTL_DAYS: ${COMPASS_CONTEXT_SNAPSHOT_TTL_DAYS:-14}
      COMPASS_CONTEXT_SECURITY_MODE: ${COMPASS_CONTEXT_SECURITY_MODE:-enforce}
      COMPASS_CONTEXTOPS_MCP_ENABLED: ${COMPASS_CONTEXTOPS_MCP_ENABLED:-true}
      COMPASS_CONTEXT_RESULTS_ROOT: /var/lib/compass/tool-results
      COMPASS_ROUTING_JEV_PROVIDER_ID: ${COMPASS_ROUTING_JEV_PROVIDER_ID:-}
      COMPASS_CONTEXT_SCOPE_PROFILES: ${COMPASS_CONTEXT_SCOPE_PROFILES:-[]}
      COMPASS_EMBEDDING_PROVIDER_ID: ${COMPASS_EMBEDDING_PROVIDER_ID:-}
      COMPASS_SEMANTIC_WORKSPACES: ${COMPASS_SEMANTIC_WORKSPACES:-}
      COMPASS_METRIC_DICTIONARY_PATH: ${COMPASS_CONTAINER_METRIC_DICTIONARY_PATH:-}
      COMPASS_RUNTIME_KEY_VERSION: ${COMPASS_RUNTIME_KEY_VERSION:-local-v1}
      COMPASS_RUNTIME_MAX_ACTIVE: ${COMPASS_RUNTIME_MAX_ACTIVE:-1000}
      COMPASS_RUNTIME_MAX_BACKLOG: ${COMPASS_RUNTIME_MAX_BACKLOG:-3000}
      COMPASS_RUNTIME_TENANT_ACTIVE: ${COMPASS_RUNTIME_TENANT_ACTIVE:-200}
      COMPASS_RUNTIME_TENANT_BACKLOG: ${COMPASS_RUNTIME_TENANT_BACKLOG:-20}
      COMPASS_RUNTIME_TENANT_OVERRIDES: ${COMPASS_RUNTIME_TENANT_OVERRIDES:-{}}
      COMPASS_RUNTIME_LEASE_SECONDS: ${COMPASS_RUNTIME_LEASE_SECONDS:-15}
      COMPASS_WEB_AUTHZ_URL: http://web:8100/api/internal/analysis/authorize
      DATABASE_URL: ${COMPASS_AGENT_RUNTIME_URL:-postgresql+psycopg://compass_agent_runtime:compass_agent_runtime_local_only@postgres:5432/compass_agent}
      COMPASS_DEMO_ENABLED: "true"
      COMPASS_AGENT_SERVICE_TOKEN: ${COMPASS_AGENT_SERVICE_TOKEN:-}
      COMPASS_MODEL_ENCRYPTION_KEY: ${COMPASS_MODEL_ENCRYPTION_KEY:-}
      COMPASS_MODEL_ALLOWED_ORIGINS: ${COMPASS_MODEL_ALLOWED_ORIGINS:-https://api.deepseek.com}
      COMPASS_MODEL_MAX_CONCURRENCY: ${COMPASS_MODEL_MAX_CONCURRENCY:-8}
      COMPASS_MODEL_MAX_INFLIGHT: ${COMPASS_MODEL_MAX_INFLIGHT:-32}
      COMPASS_CONTROLLED_AUTONOMY_ENABLED: ${COMPASS_CONTROLLED_AUTONOMY_ENABLED:-false}
      COMPASS_AUTONOMY_MODEL_PROFILES: ${COMPASS_AUTONOMY_MODEL_PROFILES:-[]}
      COMPASS_AUTONOMY_TOKEN_BUDGET: ${COMPASS_AUTONOMY_TOKEN_BUDGET:-160000}
      COMPASS_AUTONOMY_COST_BUDGET_MICROUSD: ${COMPASS_AUTONOMY_COST_BUDGET_MICROUSD:-500000}
      COMPASS_RETAIL_ALLOWED_ENDPOINTS: ${COMPASS_RETAIL_ALLOWED_ENDPOINTS:-127.0.0.1:55432,localhost:55432,postgres:5432}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      COMPASS_DATA_ALLOWED_ENDPOINTS: ${COMPASS_DATA_ALLOWED_ENDPOINTS:-127.0.0.1:5432,localhost:5432,127.0.0.1:3306,localhost:3306,mysql:3306}
      COMPASS_MCP_ALLOWED_ORIGINS: ${COMPASS_MCP_ALLOWED_ORIGINS:-}
      COMPASS_MCP_LOCAL_FIXTURE_ORIGINS: ${COMPASS_MCP_LOCAL_FIXTURE_ORIGINS:-}
      COMPASS_TOOL_BATCH_MODE: ${COMPASS_TOOL_BATCH_MODE:-serial}
      COMPASS_TOOL_FAILURE_MODE: ${COMPASS_TOOL_FAILURE_MODE:-stop}
      COMPASS_SANDBOX_ENABLED: ${COMPASS_SANDBOX_ENABLED:-false}
      COMPASS_SANDBOX_DOMAIN: ${COMPASS_SANDBOX_DOMAIN:-127.0.0.1:8112}
      COMPASS_SANDBOX_API_KEY: ${COMPASS_SANDBOX_API_KEY:-}
      COMPASS_SANDBOX_IMAGE: ${COMPASS_SANDBOX_IMAGE:-compass-sandbox-python:lesson18}
      COMPASS_SANDBOX_HOST_ID: ${COMPASS_SANDBOX_HOST_ID:-lesson18-local}
      COMPASS_SANDBOX_VOLUME_PREFIX: ${COMPASS_SANDBOX_VOLUME_PREFIX:-compass-sandbox-slot}
      COMPASS_SANDBOX_SLOTS: ${COMPASS_SANDBOX_SLOTS:-16}
    volumes:
      - context-results:/var/lib/compass/tool-results
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web-migrate:
    profiles: [app, web]
    build:
      context: ../..
      dockerfile: deploy/containers/web.Dockerfile
      target: database-tools
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      WEB_PROVISION_DATABASE_URL: postgresql://compass:compass_local_only@postgres:5432/compass
      WEB_MIGRATION_DATABASE_URL: postgresql://compass_web_migrator:compass_web_migration_local_only@postgres:5432/compass_web
      WEB_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@postgres:5432/compass_web
    depends_on:
      postgres:
        condition: service_healthy
  web:
    env_file:
      - path: ../../work/observability/web.env
        required: false
    profiles: [app, web]
    build:
      context: ../..
      dockerfile: deploy/containers/web.Dockerfile
      args:
        COMPASS_NPM_REGISTRY: ${COMPASS_NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      AGENT_API_URL: http://agent-gateway:8102
      COMPASS_AGENT_SERVICE_TOKEN: ${COMPASS_AGENT_SERVICE_TOKEN:-}
      COMPASS_DEMO_ENABLED: "true"
      WEB_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@postgres:5432/compass_web
      COMPASS_DOCUMENTS_ROOT: /srv/compass/documents
      COMPASS_DOCUMENTS_PIN_DIR: /var/lib/compass/document-pins
      WEB_PUBLIC_ORIGIN: http://127.0.0.1:8100
      WEB_AUTH_ALLOW_LOCAL_HTTP: "true"
      HOSTNAME: 0.0.0.0
      PORT: "8100"
    volumes:
      - ${COMPASS_DOCUMENTS_ROOT:-../../work/document-releases}:/srv/compass/documents:ro
      - ${COMPASS_DOCUMENTS_PIN_DIR:-documents-pins}:/var/lib/compass/document-pins
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  memory:
    profiles: [memory]
    build:
      context: ../..
      dockerfile: deploy/containers/memory.Dockerfile
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  agent-gateway:
    profiles: [app]
    image: public.ecr.aws/docker/library/nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:8102:8102"
    volumes:
      - ../nginx/agent.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8102/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
  scheduler:
    profiles: [app]
    image: compass-agent:local
    init: true
    command: [python, -m, compass_agent.scheduler.main]
    stop_grace_period: 12s
    restart: unless-stopped
    environment:
      COMPASS_SCHEDULER_DATABASE_URL: *scheduler-dsn
      COMPASS_SCHEDULER_AGENT_URL: http://agent-gateway:8102
      COMPASS_SCHEDULER_TOKEN: ${COMPASS_SCHEDULER_TOKEN:-compass_scheduler_local_only}
      COMPASS_RUNTIME_STATE_KEY: ${COMPASS_RUNTIME_STATE_KEY:-}
    depends_on:
      agent-gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, compass_agent.scheduler.main, --check]
      interval: 3s
      timeout: 4s
      retries: 20
volumes:
  context-results:
  documents-pins:
  redis-data:
  postgres-data:
